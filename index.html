/* ─────────────────────────  Сезон по свету, а не по календарю  ─────────────────────────
   Прежняя модель («лето = апрель–сентябрь») давала ступеньку 1 апреля и 1 октября:
   интервал полива менялся вдвое за один день, за две недели до включения отопления.
   Теперь интервал плавно едет между летним и зимним по длине светового дня в вашей широте,
   а отопление добавляет поправку на сухой воздух. */
function daylightHours(latDeg, date) {
  const lat = (latDeg == null ? 55.75 : latDeg) * Math.PI / 180;
  const d = date || new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  const doy = Math.floor((d - start) / 86400000);
  const decl = 0.409 * Math.sin(2 * Math.PI / 365 * doy - 1.39);
  const x = -Math.tan(lat) * Math.tan(decl);
  if (x <= -1) return 24;
  if (x >= 1) return 0;
  return 24 / Math.PI * Math.acos(x);
}
/* 0 — разгар лета, 1 — глубокая зима */
function winterness(profile, date) {
  const h = daylightHours(profile && profile.lat, date);
  const t = (15 - h) / (15 - 8);
  return Math.max(0, Math.min(1, t));
}
/* Паспорт = то, что составил садовник, поверх этого — то, что поправил человек.
   Кнопка «обновить» переписывает только care, поэтому правки переживают её по построению. */
function careOf(p) {
  if (!p) return {};
  return p.careUser ? {

    ...p.careUser

}

/* Интервал полива с учётом сезона, отопления и личной поправки экземпляра */
function waterInterval(p, profile) {
  const care = careOf(p);
  const s = Number(care.wateringSummer) || 0;
  const w = Number(care.wateringWinter) || 0;
  if (!s && !w) return null;
  const a = s || w;
  const b = w || s;
  const t = winterness(profile);
  let iv = a + (b - a) * t;
  /* Батареи сушат воздух и верх кома — растение пьёт чуть чаще, чем «по светодню» */
  if (profile && profile.heatingOn && t > 0.3) iv *= 0.88;
  /* Досветка отменяет зимнее замедление: под лампой растение живёт в июле */
  if (p.lamp) iv = a + (b - a) * Math.min(t, 0.25);
  /* Личная поправка: приложение учит реальный горшок по ответам «ещё влажно / пересохло» */
  const k = typeof p.careAdjust === "number" ? p.careAdjust : 1;
  iv = iv * Math.max(0.5, Math.min(2, k));
  return Math.max(1, Math.round(iv));
}
function seasonLabel(profile) {
  const t = winterness(profile);
  if (t < 0.2) return "летний режим";
  if (t < 0.45) return "переходный режим";
  if (t < 0.75) return "осенне-весенний режим";

}
/* Подкормки: летний интервал, зимой — только если паспорт назвал зимний
   (цветущие зимой, цитрусовые в тепле, всё под лампой) */
function feedInterval(p, profile) {
  const care = careOf(p);
  const t = winterness(profile);
  const summer = Number(care.feedIntervalSummerDays) || 0;
  const winter = Number(care.feedIntervalWinterDays) || 0;
  if (t < 0.45) return summer || null;
  if (p.lamp && summer) return Math.round(summer * 1.5);
  return winter || null;
}

/* Нормализация латинского имени до «род + вид»: отбрасываем сорт, скобки, пометки. */
function speciesKey(latin, fallbackName) {
  let s = (latin || "").toLowerCase();
  if (!s.trim()) {
    return (fallbackName || "").toLowerCase().replace(/[«»"'()].*$/g, "").replace(/\bсорт\b.*$/g, "").replace(/\s+/g, " ").trim();
  }
  s = s.replace(/\(.*?\)/g, " ");
  s = s.replace(/['"«»‘’].*?['"«»‘’]/g, " ");
  s = s.replace(/×/g, " ");
  s = s.replace(/\b(сорт|cv|var|subsp|ssp|forma|miniature|мини|миниатюрная|hort)\b\.?/g, " ");

/* Сжатие фото: maxSide px, JPEG */
function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let width = img.width,
          height = img.height;
        if (width > maxSide || height > maxSide) {
          const k = maxSide / Math.max(width, height);
          width = Math.round(width * k);
          height = Math.round(height * k);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function geocodeCity(city) {
  const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=ru&format=json";
  const r = await fetch(url);

async function fetchWeather(lat, lon) {

/* Порог холодового ПОВРЕЖДЕНИЯ обычно на 5–10° выше летального минимума:
   калатее плохо уже при +12, цитрусу при +8–10, монстере при +7–8. */
/* Выше этого звать заносить бессмысленно: в комнате примерно столько же.
   Потолок применяется и при чтении старых паспортов — в них лежат числа,
   выданные по прежнему промпту, где у модели просили «на 5–10 градусов выше
   минимума». Пересоздавать паспорта ради этого не нужно. */
const CHILL_CEILING = 16;
function chillPoint(p) {
  const care = careOf(p);
  /* Число, поставленное человеком руками, не трогаем: она видела растение. */
  const own = p && p.careUser;
  if (own && typeof own.chillDamageTempC === "number") return own.chillDamageTempC;
  if (typeof care.chillDamageTempC === "number") return Math.min(care.chillDamageTempC, CHILL_CEILING);
  /* Когда порог не указан, считаем от переносимого минимума. Запас был пять
     градусов — и давал ровные +20 у всех тропических лиственных, у которых
     в паспорте стоит минимум +15. Это перестраховка: фикус сыплет лист
     примерно от +15, при +18 ему нормально. По примерам в комментарии выше
     запас составляет два градуса, а не пять.
     Потолок +16: выше звать заносить бессмысленно — дома примерно столько же. */
  if (typeof care.minTempC === "number") return Math.min(care.minTempC + 2, CHILL_CEILING);
  return 5;
}

/* Какой балкон у растения: p.spot собран из label места, поэтому ищем по началу
   строки; если балкон в квартире один — берём его. */
function plantBalconyKind(p, profile) {
  if (!p || p.location !== "balcony") return null;
  const balconies = (profile && profile.spots || []).filter(s => s.isBalcony);
  if (balconies.length === 0) return null;
  const norm = x => (x || "").toLowerCase().replace(/[«»"']/g, "").trim();
  const label = norm(p.spot);
  let hit = label && balconies.find(s => norm(s.label) && label.indexOf(norm(s.label)) === 0);
  if (!hit && label) hit = balconies.find(s => norm(s.label) && label.indexOf(norm(s.label)) >= 0);
  if (hit) return balconyKindOf(hit, profile);
  /* Место не сопоставилось — название могли переименовать. Если все балконы
     квартиры одного вида, ответ всё равно однозначен. */
  const kinds = balconies.map(s => balconyKindOf(s, profile));
  const uniq = kinds.filter((k, i) => k && kinds.indexOf(k) === i);
  return uniq.length === 1 ? uniq[0] : null;
}

/* Из прогноза — тёплые подсказки для «Сегодня» плюс поимённый список тех, кому холодно */
function weatherHints(w, balconyPlants, profile) {
  const hints = [];
  const t = Math.round(w.tmax);
  const tn = Math.round(w.tmin);
  const hasBalcony = balconyPlants.length > 0;
  let mood = "cloudSun";
  if (w.tmax >= 24) mood = "sun";else if (w.tmax <= 5) mood = "snow";else if (w.tmax <= 12) mood = "cloud";
  hints.push({
    icon: mood,
    text: "\u0414\u043D\u0451\u043C \u0434\u043E +".concat(t, "\xB0, \u043D\u043E\u0447\u044C\u044E ").concat(tn > 0 ? "+" + tn : tn, "\xB0.").concat(w.rain >= 1 ? " \u041E\u0441\u0430\u0434\u043A\u0438 ~".concat(Math.round(w.rain), " \u043C\u043C.") : ""),
    lead: true
  });
  if (w.tmax >= 30) hints.push({
    icon: "drop",
    text: "Жара. Влаголюбивым — проверить землю к вечеру; суккулентам и замиокулькасу лишняя вода в жару опаснее засухи."
  });else if (w.tmax >= 26) hints.push({
    icon: "drop",
    text: "Тепло — растения пьют активнее обычного, загляните в поддоны."
  });
  if (hasBalcony) {
    /* Считаем по месту, а не по улице: под стеклом ночью теплее, а днём на
       солнце жарче. Ниже нуля на улице предупреждаем в любом случае —
       холодный застеклённый балкон уходит в минус вслед за ней. */
    const at = p => spotTemp(w, plantBalconyKind(p, profile));
    const coldTonight = balconyPlants.filter(p => {
      const t = at(p);
      return t.tmin <= chillPoint(p) || t.coldSure && !t.indoor && chillPoint(p) >= 0;
    });
    const coldTomorrow = balconyPlants.filter(p => at(p).tminNext <= chillPoint(p));
    const unknownKind = balconyPlants.some(p => plantBalconyKind(p, profile) === null);
    /* Сообщение называет и уличную цифру, и ту, с которой сравнивали:
       иначе «на улице 12° — это уже холодно» не сходится с порогом 18°,
       и заодно видно, каким приложение считает балкон. */
    const whereT = p => {
      const k = plantBalconyKind(p, profile);
      const t = spotTemp(w, k);
      if (k === "glazedWarm") return "\u043D\u0430 \u0442\u0451\u043F\u043B\u043E\u043C \u0431\u0430\u043B\u043A\u043E\u043D\u0435 \u043E\u043A\u043E\u043B\u043E +".concat(Math.round(t.tmin), "\xB0");
      if (k === "glazedCold") return "\u043D\u0430 \u0437\u0430\u0441\u0442\u0435\u043A\u043B\u0451\u043D\u043D\u043E\u043C \u0431\u0430\u043B\u043A\u043E\u043D\u0435 \u043E\u043A\u043E\u043B\u043E +".concat(Math.round(t.tmin), "\xB0");
      return null;
    };
    if (coldTonight.length) {
      const where = whereT(coldTonight[0]);
      const names = coldTonight.map(p => p.nickname || p.name).join(", ");
      const bounds = coldTonight.map(p => chillPoint(p));
      const lowest = Math.min.apply(null, bounds);
      const highest = Math.max.apply(null, bounds);
      hints.push({
        icon: "thermo",
        tone: "warn",
        text: "\u041D\u043E\u0447\u044C\u044E \u043D\u0430 \u0443\u043B\u0438\u0446\u0435 ".concat(Math.round(w.tmin), "\xB0").concat(where ? ", " + where : "", " \u2014 \u043F\u0440\u043E\u0445\u043B\u0430\u0434\u043D\u043E \u0434\u043B\u044F: ").concat(names, ".") + " \u041F\u043E\u0440\u043E\u0433 ".concat(highest === lowest ? "+" + Math.round(lowest) + "°" : "+" + Math.round(lowest) + "…+" + Math.round(highest) + "°", ". \u0417\u0430\u043D\u0435\u0441\u0438\u0442\u0435.") + (unknownKind ? " Если балкон застеклён, у вас теплее — уточните в настройках." : "")
      });
    } else if (coldTomorrow.length) {
      const where = whereT(coldTomorrow[0]);
      hints.push({
        icon: "thermo",
        text: "\u0417\u0430\u0432\u0442\u0440\u0430 \u043D\u043E\u0447\u044C\u044E \u043D\u0430 \u0443\u043B\u0438\u0446\u0435 ".concat(Math.round(w.tminNext), "\xB0").concat(where ? ", " + where : "", " \u2014 \u043F\u0440\u0438\u0433\u043E\u0442\u043E\u0432\u044C\u0442\u0435\u0441\u044C \u0437\u0430\u043D\u0435\u0441\u0442\u0438: ").concat(coldTomorrow.map(p => p.nickname || p.name).join(", "), ".")
      });
    }
    const hotGlazed = balconyPlants.filter(p => {
      const k = plantBalconyKind(p, profile);
      return (k === "glazedCold" || k === "glazedWarm") && spotTemp(w, k).tmax >= 33;
    });
    if (hotGlazed.length) {
      hints.push({
        icon: "sun",
        tone: "warn",
        text: "\u0417\u0430 \u0441\u0442\u0435\u043A\u043B\u043E\u043C \u043D\u0430 \u0441\u043E\u043B\u043D\u0446\u0435 \u0431\u0443\u0434\u0435\u0442 \u043E\u043A\u043E\u043B\u043E +".concat(Math.round(spotTemp(w, "glazedCold").tmax), "\xB0 \u2014 \u0436\u0430\u0440\u0447\u0435, \u0447\u0435\u043C \u043D\u0430 \u0443\u043B\u0438\u0446\u0435. \u041F\u0440\u0438\u043E\u0442\u043A\u0440\u043E\u0439\u0442\u0435 \u0441\u0442\u0432\u043E\u0440\u043A\u0443 \u0438\u043B\u0438 \u043F\u0440\u0438\u0442\u0435\u043D\u0438\u0442\u0435: ").concat(hotGlazed.map(p => p.nickname || p.name).join(", "), ".")
      });
    }
    const openAir = balconyPlants.filter(p => {
      const k = plantBalconyKind(p, profile);
      return k === null || k === "open";
    });
    if (w.rain >= 5 && openAir.length) {
      hints.push({
        icon: "cloud",
        text: "Дождь: балконные под открытым небом можно не поливать — но проверьте, доходит ли вода под кроной и есть ли дренаж."
      });
    }
  }
  if (w.tmax <= 5) hints.push({
    icon: "snow",
    text: "Холодно. Берегите от сквозняков у окон и подложите что-нибудь под горшки на подоконнике — холодный ком корни не пьют."
  });
  const wint = winterness(profile);
  if (wint > 0.6 && profile && !profile.heatingOn) {
    hints.push({
      icon: "thermo",
      text: "Похоже, отопительный сезон уже близко — отметьте его в настройках, чтобы поправка на сухой воздух заработала.",
      ask: "heating"
    });
  }
  return hints;
}

function parseJson(text) {
  let clean = text.replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  let body = clean.slice(start, end + 1);
  body = body.replace(/,\s*\.\.\.\s*/g, " ").replace(/\[\s*\.\.\.\s*\]/g, "[]").replace(/\.\.\./g, "").replace(/,\s*([\]}])/g, "$1");
  return JSON.parse(body);
}

/* Если ответ оборвался на середине — собираем валидный JSON из целых кусков */
function parseJsonSalvage(text) {
  try {
    return parseJson(text);
  } catch (e) {/* пробуем спасти */}
  const clean = (text || "").replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  if (start < 0) throw new Error("no json");
  const s = clean.slice(start);
  let cut = s.length;
  for (let step = 0; step < 40; step++) {
    const i = s.lastIndexOf("}", cut - 1);
    if (i < 0) break;
    const base = s.slice(0, i + 1);
    const sufs = ["", "]}", "}]}", '"}]}'];
    for (let k = 0; k < sufs.length; k++) {
      try {
        return JSON.parse(base + sufs[k]);
      } catch (e2) {/* следующий вариант */}
    }
    cut = i;
  }
  throw new Error("unparsable");
}

/* Подстраховка от самой правдоподобной выдумки модели — чисел «раз в N дней».
   Загоняем в разумные рамки и следим, чтобы зима не оказалась короче лета. */
function clampCare(c) {
  const num = (v, lo, hi) => {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    return Math.max(lo, Math.min(hi, Math.round(n)));
  };
  const out = {
    ...c
  };
  out.wateringSummer = num(c.wateringSummer, 1, 40) || 7;
  out.wateringWinter = num(c.wateringWinter, 1, 90) || out.wateringSummer * 2;
  if (out.wateringWinter < out.wateringSummer) out.wateringWinter = out.wateringSummer;
  out.mistIntervalDays = c.mistOk === false ? null : num(c.mistIntervalDays, 1, 30);
  out.wipeIntervalDays = num(c.wipeIntervalDays, 3, 90);
  out.feedIntervalSummerDays = num(c.feedIntervalSummerDays, 7, 60);
  out.feedIntervalWinterDays = num(c.feedIntervalWinterDays, 14, 120);
  out.feedLockoutAfterRepotDays = num(c.feedLockoutAfterRepotDays, 14, 90) || 42;
  out.repotEveryMonths = num(c.repotEveryMonths, 6, 60) || 24;
  out.potStepCm = num(c.potStepCm, 1, 6) || 2;
  const t = Number(c.minTempC);
  out.minTempC = isFinite(t) ? Math.max(-15, Math.min(20, Math.round(t))) : null;
  const cd = Number(c.chillDamageTempC);
  out.chillDamageTempC = isFinite(cd) ? Math.max(-10, Math.min(CHILL_CEILING, Math.round(cd))) : out.minTempC != null ? Math.min(CHILL_CEILING, out.minTempC + 2) : null;
  /* Порог повреждения по определению выше летального минимума. Инверсия означала бы,
     что предупреждение «занесите с балкона» не сработает вовсе. */
  if (out.chillDamageTempC != null && out.minTempC != null && out.chillDamageTempC < out.minTempC) {
    out.chillDamageTempC = Math.min(CHILL_CEILING, out.minTempC + 2);
  }
  return out;
}

  async function persist(next) {

    } else if (payload.length < STORE_WARN_CHARS * 0.9) {

      sizeWarned.current = false;
    }
    try {
      await appStorage.set("garden:data", payload);
      setHealth(h => h.localFail ? {

      } : h);

        ...h,

  /* ── единая точка изменения сада + отмена последнего действия ── */

  /* «Отменить» показывается ТОЛЬКО когда действие само об этом попросило.
     Раньше кнопка цеплялась к любому сообщению, включая ошибки, и откатывала

  /* ── дневник ── */
  function journalWith(j, plantId, type, text, extra, dateISO) {

  const active = useMemo(() => plants.filter(p => (p.status || "active") === "active"), [plants]);

  /* ── что «пора» ──
     Дни ухода: если выбраны, например, Пн и Чт — задачи показываем только в эти дни.
     Растение попадает в тот день ухода, который ближе к сроку; при равенстве ждём

  const careDays = profile && profile.careDays || [];

  function quarantineLeft(p) {
    if (p.origin === "offshoot") return 0;

    if (p.ownedSince && p.ownedSince < today().slice(0, 7)) return 0;

    if (p.treatment && p.treatment.active) return "идёт лечение — подкормки отменяются полностью";
    if (quarantineLeft(p) > 0) return "карантин — новичка не кормят";
    const lock = careOf(p).feedLockoutAfterRepotDays || 42;
    if (p.lastRepot) {
      /* Считаем от начала месяца пересадки: раньше отсчёт шёл от 15-го числа,

      const d = Math.round((Date.now() - new Date(p.lastRepot + "-01T00:00:00").getTime()) / 86400000);

  function repotDue(p) {

  /* ── действия ухода ── */
  const CARE_KINDS = {

  function snoozeWater(p, daysRaw, learn) {

/* Поделиться, а не «скачать в загрузки»: на телефоне открытка нужна в мессенджере */
async function sharePostcard(cv, filename, showToast) {
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if (!blob) {
    showToast("Не получилось нарисовать");
    return;
  }
  try {
    if (navigator.canShare && navigator.share) {
      const file = new File([blob], filename, {
        type: "image/png"
      });
      if (navigator.canShare({
        files: [file]
      })) {
        await navigator.share({
          files: [file],
          title: "Мой сад"
        });
        return;
      }
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    try {
      document.body.removeChild(a);
    } catch (e) {}
    URL.revokeObjectURL(url);
  }, 1500);
  showToast("Открытка сохранена 🖼");
}
